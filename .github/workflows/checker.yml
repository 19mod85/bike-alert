name: Canyon Checker

on:
  schedule:
    - cron: '0 */3 * * *'  # Uruchamia automatycznie co 3 godziny
  workflow_dispatch:        # Manualne uruchamianie

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Canyon State
        uses: actions/cache@v4
        with:
          path: canyon_state.json
          key: canyon-state-${{ github.run_id }}
          restore-keys: |
            canyon-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python checker.py